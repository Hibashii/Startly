<svg xmlns="http://www.w3.org/2000/svg" viewBox="12 15 96 86">
  <!-- Startly's avatar as a solid colorless shape: black on light tabs, white on dark tabs, so it never clashes with the accent.
       Eyes, eye shine and bow tie are cut out of the head; the headset sits on top with a small gap. -->
  <style>
    .k { fill: #1b1b1f } .s { stroke: #1b1b1f }
    @media (prefers-color-scheme: dark) { .k { fill: #f2f2f2 } .s { stroke: #f2f2f2 } }
  </style>
  <defs>
    <mask id="cut" maskUnits="userSpaceOnUse" x="0" y="0" width="120" height="120">
      <rect x="27" y="30" width="66" height="66" rx="24" fill="#fff"/>
      <path d="M24 60q0-38 36-38t36 38" stroke="#000" stroke-width="12.5" fill="none" stroke-linecap="round"/>
      <rect x="11.5" y="45.5" width="22" height="30" rx="9.5" fill="#000"/>
      <rect x="86.5" y="45.5" width="22" height="30" rx="9.5" fill="#000"/>
      <path d="M98 71q0 15-17 16" stroke="#000" stroke-width="10.6" fill="none" stroke-linecap="round"/>
      <circle cx="80" cy="87" r="7.5" fill="#000"/>
      <circle cx="47" cy="60" r="7" fill="#000"/>
      <circle cx="73" cy="60" r="7" fill="#000"/>
      <circle cx="49.2" cy="57.8" r="2.3" fill="#fff"/>
      <circle cx="75.2" cy="57.8" r="2.3" fill="#fff"/>
      <path d="M47 79l13 6.5-13 6.5zM73 79l-13 6.5 13 6.5z" fill="#000"/>
      <circle cx="60" cy="85.5" r="3.6" fill="#000"/>
    </mask>
  </defs>
  <rect class="k" width="120" height="120" mask="url(#cut)"/>
  <g class="k">
    <rect x="15" y="49" width="15" height="23" rx="6"/>
    <rect x="90" y="49" width="15" height="23" rx="6"/>
    <circle cx="80" cy="87" r="4"/>
  </g>
  <g class="s" fill="none" stroke-linecap="round">
    <path d="M24 60q0-38 36-38t36 38" stroke-width="5.5"/>
    <path d="M98 71q0 15-17 16" stroke-width="3.6"/>
  </g>
</svg>
